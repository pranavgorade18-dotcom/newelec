<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard | NearBy</title><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body"><header class="admin-topbar"><a class="admin-brand-dark" href="index.html">📱 NearBy <strong>Electronic</strong></a><div class="admin-user"><div><strong>Pranav Gorade</strong><small>Administrator</small></div><div class="admin-avatar">PG</div><button onclick="logoutAdmin()">Log out</button></div></header>
<main class="admin-shell"><div class="admin-heading"><div><p class="eyebrow">ADMIN CONTROL</p><h1>Shop approvals</h1></div><button class="logout-admin" onclick="window.location.href='index.html'">View marketplace</button></div>
<section class="stats-grid"><article class="stat-card"><small>Pending approvals</small><strong id="pendingCount">0</strong></article><article class="stat-card"><small>Approved shops</small><strong id="approvedCount">0</strong></article><article class="stat-card"><small>Total applications</small><strong id="totalCount">0</strong></article></section>
<section class="applications-card"><div class="applications-heading"><div><p class="eyebrow">VERIFICATION QUEUE</p><h2>Shop applications</h2></div><button class="logout-admin" onclick="renderApplications()">Refresh</button></div><div id="applicationsList"></div></section></main><div class="toast" id="adminToast"></div>
<script>
if(!sessionStorage.getItem('nearbyAdminSession'))window.location.href='admin-login.html';
let applications=JSON.parse(localStorage.getItem('nearbyShopApplications')||'[]');
function save(){localStorage.setItem('nearbyShopApplications',JSON.stringify(applications));renderApplications();}
function renderApplications(){applications=JSON.parse(localStorage.getItem('nearbyShopApplications')||'[]');const pending=applications.filter(a=>a.status==='pending');const approved=applications.filter(a=>a.status==='approved');document.getElementById('pendingCount').textContent=pending.length;document.getElementById('approvedCount').textContent=approved.length;document.getElementById('totalCount').textContent=applications.length;const list=document.getElementById('applicationsList');if(!applications.length){list.innerHTML='<div class="empty-admin"><h3>No shop applications yet</h3><p>Applications submitted from the Shop Owner account form will appear here.</p></div>';return;}list.innerHTML=applications.slice().reverse().map((a,index)=>{const realIndex=applications.length-1-index;const status=a.status||'pending';const statusClass=status==='approved'?'approved':status==='rejected'?'rejected':'';const statusText=status==='approved'?'Approved':status==='rejected'?'Rejected':'Pending verification';return `<div class="application-row"><div class="app-shop"><span class="app-icon">🏪</span><div><strong>${escapeHtml(a.shopName)}</strong><small>${escapeHtml(a.email)}</small></div></div><div><small>Business / GST</small><strong>${escapeHtml(a.businessNumber||'Not provided')}</strong></div><span class="status-badge ${statusClass}">${statusText}</span><div class="row-actions">${status==='pending'?`<button class="approve-button" onclick="approveShop(${realIndex})">✓ Approve</button><button class="reject-button" onclick="rejectShop(${realIndex})">Reject</button>`:`<button class="approve-button" onclick="emailDecision(${realIndex})">Email</button>`}</div></div>`;}).join('');}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function approveShop(index){applications[index].status='approved';applications[index].approvedAt=new Date().toISOString();save();toast('Shop approved and account opened');openApprovalDraft(index,'approved');}
function rejectShop(index){if(!confirm('Reject this shop application?'))return;applications[index].status='rejected';applications[index].rejectedAt=new Date().toISOString();save();toast('Shop application rejected');openApprovalDraft(index,'rejected');}
function emailDecision(index){openApprovalDraft(index,applications[index].status);}
function openApprovalDraft(index,status){const a=applications[index];const subject=encodeURIComponent(status==='approved'?`Shop account approved — ${a.shopName}`:`Shop account update — ${a.shopName}`);const message=status==='approved'?`Hello ${a.shopName},\n\nCongratulations! Your shop account has been approved by the NearBy Electronics admin team. You can now sign in and update your products, stock quantities, and availability.\n\nBest regards,\nNearBy Electronics Admin`: `Hello ${a.shopName},\n\nThank you for applying. Your shop account application has been reviewed and is not approved at this time. Please contact the admin for the verification requirements.\n\nBest regards,\nNearBy Electronics Admin`;const body=encodeURIComponent(message);const cc=encodeURIComponent('pranavgorade18@gmail.com');window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(a.email||'')}&cc=${cc}&su=${subject}&body=${body}`,'_blank','noopener');}
function logoutAdmin(){sessionStorage.removeItem('nearbyAdminSession');window.location.href='admin-login.html';}
function toast(text){const el=document.getElementById('adminToast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
renderApplications();
</script></body></html>
