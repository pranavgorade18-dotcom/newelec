<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Login | NearBy Electronic</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
  <main class="admin-login-shell">
    <section class="admin-login-brand">
      <a href="index.html" class="admin-brand">📱 NearBy <strong>Electronic</strong></a>
      <div><p>PRIVATE ADMIN ACCESS</p><h1>Shop verification<br><span>control center</span></h1></div>
    </section>
    <section class="admin-login-panel">
      <a class="back-link" href="index.html">← Marketplace</a>
      <form class="admin-login-card" id="adminLoginForm">
        <div class="shield">🛡️</div><p class="eyebrow">RESTRICTED</p><h2>Administrator login</h2>
        <p>Sign in to review and approve shop owner accounts.</p>
        <label>Admin email<input id="adminEmail" type="email" value="pranavgorade18@gmail.com" required autocomplete="username"></label>
        <label>Secure password<input id="adminPassword" type="password" value="Admin@123" required autocomplete="current-password"></label>
        <button type="submit">Sign in securely →</button>
        <small class="demo-note">Demo credentials are stored in this browser. Password protection is not server-secured.</small>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const email=document.getElementById('adminEmail').value.trim().toLowerCase();
      const password=document.getElementById('adminPassword').value;
      if(email!=='pranavgorade18@gmail.com'||password!=='Admin@123'){alert('Invalid administrator credentials.');return;}
      sessionStorage.setItem('nearbyAdminSession','active');
      window.location.href='admin-dashboard.html';
    });
  </script>
</body>
</html>
